name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  detect:
    name: 偵測各部分是否存在
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.d.outputs.python }}
      web: ${{ steps.d.outputs.web }}
      dotnet: ${{ steps.d.outputs.dotnet }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        run: |
          echo "python=$([ -f src/Tools.Calibration/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -f src/Instruments.Web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "dotnet=$([ -f SimosaBRM.sln ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  python:
    name: Python 參考實作與校正工具
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 測試
        working-directory: src/Tools.Calibration
        run: |
          uv sync --all-extras
          uv run pytest -q
  web:
    name: 網頁儀器
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 建置與測試
        working-directory: src/Instruments.Web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
  dotnet:
    name: .NET 核心(Windows)
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 暫存檔導到專案內(本機資料守則)
        # 與 tools\setup-windows.ps1 相同:TEMP/TMP → <專案>\build\tmp,讓建置與測試在使用者實機的配置下執行
        # (曾有測試把 Path.GetTempPath() 當成「專案外的路徑」,暫存導回專案後才會失敗)
        run: |
          $tmp = Join-Path $env:GITHUB_WORKSPACE 'build\tmp'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          "TEMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 建置
        run: dotnet build SimosaBRM.sln -c Release
      - name: 測試
        # -m:1:測試專案依序執行。並行時 Console.Serial 的 HostEndToEndTests(真實 Host 子程序,即時 50 Hz)與雷達單核效能測試
        # 會被同時跑的 SimCore.Tests(900+ 案例)擠到逾時(run 54、55、66);各專案內部仍由 xunit 平行
        run: dotnet test SimosaBRM.sln -c Release --no-build -m:1 --logger "trx;LogFileName=test.trx"
      - name: PowerShell 腳本(Windows PowerShell 5.1 實跑)
        # 內建的 Windows PowerShell 5.1(安裝程式的捷徑與使用者雙擊都用它):所有 .ps1 能解析(UTF-8 BOM),
        # setup-windows.ps1 -SessionOnly、check-local-data.ps1、build-release.ps1 -WhatIf 能執行;
        # 執行器的工作目錄在 D:、系統磁碟為 C:,與「專案放 D: 或 G:」的實機配置相同
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $errs = @()
          Get-ChildItem tools -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors) { $errs += "$($_.FullName): $($parseErrors[0].Message)" }
          }
          if ($errs) { throw ("PowerShell 5.1 解析失敗:`n" + ($errs -join "`n")) }
          $onSys = (Get-Location).Path.StartsWith($env:SystemDrive, [System.StringComparison]::OrdinalIgnoreCase)
          if ($onSys) { .\tools\setup-windows.ps1 -SessionOnly -AllowSystemDrive } else { .\tools\setup-windows.ps1 -SessionOnly }
          .\tools\check-local-data.ps1 -Since (Get-Date)
          $rc = $LASTEXITCODE
          if ($rc -ne 0 -and -not ($onSys -and $rc -eq 2)) { throw "check-local-data.ps1 結束碼 $rc(setup-windows.ps1 -SessionOnly 之後應為 0)" }
          .\tools\build-release.ps1 -WhatIf
      - name: 本機資料守則實測(依守則設定後建置,系統磁碟不得有新資料)
        # 實機配置的端到端檢查:結束前面步驟留下的建置伺服器(它們帶著舊的環境變數)→ setup-windows.ps1 -SessionOnly →
        # 以專案內全新的 NuGet 快取還原並建置一個專案(用到 NuGet 套件 / HTTP 快取 / 還原暫存、MSBuild 暫存、.NET CLI 家目錄)→
        # check-local-data.ps1 -Since <開始時間> 必須回 0(C:\Users 下各工具的預設位置沒有新資料)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build-server shutdown | Out-Null
          Start-Sleep -Seconds 3
          $t0 = Get-Date
          $onSys = (Get-Location).Path.StartsWith($env:SystemDrive, [System.StringComparison]::OrdinalIgnoreCase)
          if ($onSys) { .\tools\setup-windows.ps1 -SessionOnly -AllowSystemDrive | Out-Null } else { .\tools\setup-windows.ps1 -SessionOnly | Out-Null }
          dotnet build src\Tools.Packaging.Cli\Tools.Packaging.Cli.csproj -c Debug --disable-build-servers -nologo -v q
          if ($LASTEXITCODE -ne 0) { throw "dotnet build 失敗(結束碼 $LASTEXITCODE)" }
          dotnet build-server shutdown | Out-Null
          .\tools\check-local-data.ps1 -Since $t0
          $rc = $LASTEXITCODE
          if ($rc -ne 0 -and -not ($onSys -and $rc -eq 2)) { throw "依守則設定後建置,check-local-data.ps1 仍回報結束碼 $rc(系統磁碟上有新資料或環境變數未指到專案內)" }
      - name: 安裝程式腳本以 Inno Setup 編譯
        # 執行器有 Inno Setup 時實際編譯 tools\installer\SimosaBRM.iss(以最小的假發行版目錄;只驗證腳本與 [Code] 能編譯,不執行安裝)。
        # 容器內只有靜態檢查(tools/installer/check-iss.py),這一步是唯一的編譯驗證;沒有 ISCC 或版本低於 6.3 時略過並留下警告。
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = $null
          foreach ($p in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) { if (Test-Path $p) { $iscc = $p; break } }
          if (-not $iscc) { Write-Host '::warning::執行器沒有 Inno Setup 6(ISCC.exe),略過安裝程式編譯檢查'; exit 0 }
          # 版本:ISCC.exe 本身沒有版本資源(讀到 0.0.0.0),改讀同資料夾的 Compil32.exe / ISCmplr.dll;讀不到就直接編譯
          $ver = $null
          foreach ($f in @('Compil32.exe', 'ISCmplr.dll', 'ISCC.exe')) {
            $path = Join-Path (Split-Path $iscc) $f
            if (-not (Test-Path $path)) { continue }
            try { $v = [version](("$((Get-Item $path).VersionInfo.ProductVersion)".Trim()) -replace '[^0-9.].*$', '') } catch { $v = $null }
            if ($v -and $v.Major -ge 1) { $ver = $v; break }
          }
          Write-Host "ISCC:$iscc(版本 $(if ($ver) { $ver } else { '未知,直接編譯' }))"
          if ($ver -and $ver -lt [version]'6.3') { Write-Host "::warning::Inno Setup $ver 低於 6.3,略過安裝程式編譯檢查"; exit 0 }
          $src = Join-Path $env:GITHUB_WORKSPACE 'build\tmp\iss-check\release'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build\tmp\iss-check\installer'
          New-Item -ItemType Directory -Force -Path (Join-Path $src 'config'), (Join-Path $src 'app\launch'), (Join-Path $src 'docs\ops'), $out | Out-Null
          Set-Content -Path (Join-Path $src 'manifest.json') -Value '{}'
          Copy-Item 'config\*.json' (Join-Path $src 'config')
          Copy-Item 'tools\launch\*.ps1' (Join-Path $src 'app\launch')
          Copy-Item 'docs\ops\安裝與啟動.md' (Join-Path $src 'docs\ops')
          $version = (Get-Content VERSION -Raw).Trim()
          & $iscc "/DAppVersion=$version" "/DSourceDir=$src" "/DOutputDir=$out" /Qp 'tools\installer\SimosaBRM.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC 編譯失敗(結束碼 $LASTEXITCODE)" }
          $setup = Get-ChildItem $out -Filter 'SimosaBRM-Setup-*.exe'
          if (-not $setup) { throw 'ISCC 未產生安裝程式' }
          Write-Host "已編譯:$($setup.Name)($([math]::Round($setup.Length / 1MB, 1)) MB)"
  e2e:
    name: 端對端(Playwright + 真實核心)
    needs: detect
    if: needs.detect.outputs.web == 'true' && needs.detect.outputs.dotnet == 'true'
    runs-on: ubuntu-24.04  # Playwright 1.56 尚不支援 ubuntu-latest(26.04)的系統相依
    timeout-minutes: 30
    env:
      # Playwright 瀏覽器、NuGet、dotnet CLI 的快取都留在工作目錄內(CLAUDE.md:不寫到專案外)
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/pw-browsers
      PWTEST_CACHE_DIR: ${{ github.workspace }}/.cache/playwright-transform
      NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget/packages
      DOTNET_CLI_HOME: ${{ github.workspace }}/.cache/dotnet-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝端對端測試套件與 Chromium
        working-directory: tests/e2e
        run: |
          pnpm install --frozen-lockfile
          npx playwright install chromium --with-deps
      - name: 建置網頁與 .NET、執行端對端測試(tools/run-e2e.sh)
        run: bash tools/run-e2e.sh
      - name: 上傳失敗截圖、trace 與程序 log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            build/e2e/test-results/
            build/e2e/report/
            build/e2e/results.json
            build/e2e/logs/
          if-no-files-found: ignore
          retention-days: 14

name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  detect:
    name: 偵測各部分是否存在
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.d.outputs.python }}
      web: ${{ steps.d.outputs.web }}
      dotnet: ${{ steps.d.outputs.dotnet }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        run: |
          echo "python=$([ -f src/Tools.Calibration/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -f src/Instruments.Web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "dotnet=$([ -f SimosaBRM.sln ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  python:
    name: Python 參考實作與校正工具
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 測試
        working-directory: src/Tools.Calibration
        run: |
          uv sync --all-extras
          uv run pytest -q
      - name: PowerShell 與安裝程式腳本的靜態檢查
        # tools/pscheck.py(.ps1 的 UTF-8 BOM、括號與字串配對、字串內變數名稱的常見手誤)、tools/installer/check-iss.py(安裝程式腳本的結構)
        run: |
          python3 tools/pscheck.py
          python3 -I tools/installer/check-iss.py tools/installer/SimosaBRM.iss
  web:
    name: 網頁儀器
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 建置與測試
        working-directory: src/Instruments.Web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
  dotnet:
    name: .NET 核心(Windows)
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: windows-latest
    timeout-minutes: 40   # 正常約 6 分鐘;沒有上限時卡住的測試會占用執行器 6 小時(run 86)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 暫存檔導到專案內(本機資料守則)
        # 與 tools\setup-windows.ps1 相同:TEMP/TMP → <專案>\build\tmp,讓建置與測試在使用者實機的配置下執行
        # (曾有測試把 Path.GetTempPath() 當成「專案外的路徑」,暫存導回專案後才會失敗)
        run: |
          $tmp = Join-Path $env:GITHUB_WORKSPACE 'build\tmp'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          "TEMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 建置
        run: dotnet build SimosaBRM.sln -c Release
      - name: 測試
        # -m:1:測試專案依序執行。並行時 Console.Serial 的 HostEndToEndTests(真實 Host 子程序,即時 50 Hz)與雷達單核效能測試
        # 會被同時跑的 SimCore.Tests(900+ 案例)擠到逾時(run 54、55、66);各專案內部仍由 xunit 平行
        # --blame-hang-timeout:單一測試超過 6 分鐘沒有結束時中止該測試主機並列出當時正在執行的測試(否則只會看到整個步驟卡住;
        # run 86 的 SimCore.Tests 在 Windows 上卡住 17 分鐘、沒有任何線索)。不產生傾印檔(--blame-hang-dump-type none)
        run: dotnet test SimosaBRM.sln -c Release --no-build -m:1 --logger "trx;LogFileName=test.trx" --blame-hang-timeout 6m --blame-hang-dump-type none
      - name: PowerShell 腳本(Windows PowerShell 5.1 實跑)
        # 內建的 Windows PowerShell 5.1(安裝程式的捷徑與使用者雙擊都用它):所有 .ps1 能解析(UTF-8 BOM),
        # setup-windows.ps1 -SessionOnly、check-local-data.ps1、build-release.ps1 -WhatIf 能執行;
        # 執行器的工作目錄在 D:、系統磁碟為 C:,與「專案放 D: 或 G:」的實機配置相同。
        # 注意:shell: powershell 的內嵌腳本由執行器寫成「沒有 BOM 的 UTF-8」,5.1 會以系統 ANSI 字碼頁讀取 —
        # 某些中文字的位元組會被當成引號而讓字串提前結束,所以 run: 內只用 ASCII(訊息用英文),中文說明寫在這裡。
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $errs = @()
          Get-ChildItem tools -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors) { $errs += "$($_.FullName): $($parseErrors[0].Message)" }
          }
          if ($errs) { throw ("Windows PowerShell 5.1 parse errors:`n" + ($errs -join "`n")) }
          $onSys = (Get-Location).Path.StartsWith($env:SystemDrive, [System.StringComparison]::OrdinalIgnoreCase)
          if ($onSys) { .\tools\setup-windows.ps1 -SessionOnly -AllowSystemDrive } else { .\tools\setup-windows.ps1 -SessionOnly }
          .\tools\check-local-data.ps1 -Since (Get-Date)
          $rc = $LASTEXITCODE
          if ($rc -ne 0 -and -not ($onSys -and $rc -eq 2)) { throw "check-local-data.ps1 exit code $rc (expected 0 after setup-windows.ps1 -SessionOnly)" }
          .\tools\build-release.ps1 -WhatIf
          exit 0
      - name: 本機資料守則實測(依守則設定後還原並建置,系統磁碟不得有新資料)
        # 實機配置的端到端檢查:結束前面步驟留下的建置伺服器(它們帶著舊的環境變數)→ setup-windows.ps1 -SessionOnly →
        # 把 NUGET_PACKAGES 指到專案內一個全新的資料夾(否則前面的「建置」步驟已還原過,這裡的還原會是 no-op,
        # NuGet HTTP 快取與還原暫存的導向根本沒被用到)→ 還原並建置一個專案 → 斷言:套件確實下載到新資料夾、
        # 專案內的 NuGet HTTP 快取(.cache\nuget\http)有新檔案、check-local-data.ps1 -Since <開始時間> 回 0
        # (C:\Users 下各工具的預設位置沒有新資料)。run: 內只用 ASCII(理由同上一步)。
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build-server shutdown | Out-Null
          Start-Sleep -Seconds 3
          $t0 = Get-Date
          $onSys = (Get-Location).Path.StartsWith($env:SystemDrive, [System.StringComparison]::OrdinalIgnoreCase)
          if ($onSys) { .\tools\setup-windows.ps1 -SessionOnly -AllowSystemDrive | Out-Null } else { .\tools\setup-windows.ps1 -SessionOnly | Out-Null }
          $env:NUGET_PACKAGES = Join-Path (Get-Location).Path '.cache\nuget\packages-ci-check'
          if (Test-Path $env:NUGET_PACKAGES) { Remove-Item -Recurse -Force $env:NUGET_PACKAGES }
          $httpBefore = @(Get-ChildItem -LiteralPath $env:NUGET_HTTP_CACHE_PATH -Recurse -File -ErrorAction SilentlyContinue).Count
          dotnet build src\Tools.Packaging.Cli\Tools.Packaging.Cli.csproj -c Debug --disable-build-servers -nologo -v q
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed (exit code $LASTEXITCODE)" }
          dotnet build-server shutdown | Out-Null
          $pkgs = @(Get-ChildItem -LiteralPath $env:NUGET_PACKAGES -Directory -ErrorAction SilentlyContinue).Count
          $httpAfter = @(Get-ChildItem -LiteralPath $env:NUGET_HTTP_CACHE_PATH -Recurse -File -ErrorAction SilentlyContinue).Count
          Write-Host "restored package folders: $pkgs; NuGet HTTP cache files inside the project: $httpBefore -> $httpAfter"
          if ($pkgs -eq 0) { throw 'restore downloaded nothing into the fresh project-local package folder (restore was a no-op?)' }
          if ($httpAfter -le $httpBefore) { throw 'the NuGet HTTP cache inside the project received no file: NUGET_HTTP_CACHE_PATH is not effective' }
          .\tools\check-local-data.ps1 -Since $t0
          $rc = $LASTEXITCODE
          if ($rc -ne 0 -and -not ($onSys -and $rc -eq 2)) { throw "check-local-data.ps1 exit code $rc after a build under the local-data rule (new data on the system drive, or a variable not pointing into the project)" }
          exit 0
      - name: 安裝程式腳本以 Inno Setup 編譯
        # 執行器有 Inno Setup 時實際編譯 tools\installer\SimosaBRM.iss(以最小的假發行版目錄;只驗證腳本與 [Code] 能編譯,不執行安裝)。
        # 容器內只有靜態檢查(tools/installer/check-iss.py),這一步是唯一的編譯驗證;沒有 ISCC 或版本低於 6.3 時略過並留下警告。
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = $null
          foreach ($p in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) { if (Test-Path $p) { $iscc = $p; break } }
          if (-not $iscc) { Write-Host '::warning::執行器沒有 Inno Setup 6(ISCC.exe),略過安裝程式編譯檢查'; exit 0 }
          # 版本:ISCC.exe 本身沒有版本資源(讀到 0.0.0.0),改讀同資料夾的 Compil32.exe / ISCmplr.dll;讀不到就直接編譯
          $ver = $null
          foreach ($f in @('Compil32.exe', 'ISCmplr.dll', 'ISCC.exe')) {
            $path = Join-Path (Split-Path $iscc) $f
            if (-not (Test-Path $path)) { continue }
            try { $v = [version](("$((Get-Item $path).VersionInfo.ProductVersion)".Trim()) -replace '[^0-9.].*$', '') } catch { $v = $null }
            if ($v -and $v.Major -ge 1) { $ver = $v; break }
          }
          Write-Host "ISCC:$iscc(版本 $(if ($ver) { $ver } else { '未知,直接編譯' }))"
          if ($ver -and $ver -lt [version]'6.3') { Write-Host "::warning::Inno Setup $ver 低於 6.3,略過安裝程式編譯檢查"; exit 0 }
          $src = Join-Path $env:GITHUB_WORKSPACE 'build\tmp\iss-check\release'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build\tmp\iss-check\installer'
          New-Item -ItemType Directory -Force -Path (Join-Path $src 'config'), (Join-Path $src 'app\launch'), (Join-Path $src 'docs\ops'), $out | Out-Null
          Set-Content -Path (Join-Path $src 'manifest.json') -Value '{}'
          Copy-Item 'config\*.json' (Join-Path $src 'config')
          Copy-Item 'tools\launch\*.ps1' (Join-Path $src 'app\launch')
          Copy-Item 'docs\ops\安裝與啟動.md' (Join-Path $src 'docs\ops')
          $version = (Get-Content VERSION -Raw).Trim()
          & $iscc "/DAppVersion=$version" "/DSourceDir=$src" "/DOutputDir=$out" /Qp 'tools\installer\SimosaBRM.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC 編譯失敗(結束碼 $LASTEXITCODE)" }
          $setup = Get-ChildItem $out -Filter 'SimosaBRM-Setup-*.exe'
          if (-not $setup) { throw 'ISCC 未產生安裝程式' }
          Write-Host "已編譯:$($setup.Name)($([math]::Round($setup.Length / 1MB, 1)) MB)"
  windows-install:
    name: Windows 實機端到端(發行版 → 安裝 → 啟動 → 解除安裝)
    # 容器(Linux)驗不到的 Windows 行為在這裡實跑:tools\ci\windows-e2e.ps1 以內建的 Windows PowerShell 5.1 執行
    # build-release.ps1 -Installer、靜默安裝(預設位置、系統磁碟須同意)、從安裝位置啟動(核心、雷達、網頁、專屬 Edge 設定檔、
    # WebView2 外殼)、stop-all.ps1、check-local-data.ps1、simosa-pkg(更新包 / 紀錄包 / 直連同步)、教官筆電單機模式、靜默解除安裝。
    # 各階段的檢查結果與 log 另存為 artifact;最後一步印出總表。
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 網頁相依套件
        working-directory: src/Instruments.Web
        run: pnpm install --frozen-lockfile
      - name: 發行組裝與安裝程式(build-release.ps1 -Installer,Windows PowerShell 5.1)
        id: build
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\ci\windows-e2e.ps1 -Stage build
      - name: 靜默安裝(系統磁碟須同意、預設位置、捷徑、防火牆、-CheckOnly、release verify)
        id: install
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\ci\windows-e2e.ps1 -Stage install
      - name: 從安裝位置啟動(核心 / 雷達 / 網頁 / 專屬 Edge 設定檔 → stop-all → check-local-data)
        if: ${{ !cancelled() && steps.install.outcome != 'skipped' }}
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\ci\windows-e2e.ps1 -Stage launch
      - name: WebView2 外殼(-Shell)
        if: ${{ !cancelled() && steps.install.outcome != 'skipped' }}
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\ci\windows-e2e.ps1 -Stage shell
      - name: 簽章更新包 / 紀錄包 / 直連同步(simosa-pkg:信任金鑰、DPAPI 裝置金鑰、verify / apply / rollback、records pack、serve + sync)
        if: ${{ !cancelled() && steps.install.outcome != 'skipped' }}
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\ci\windows-e2e.ps1 -Stage packaging
      - name: 教官筆電單機模式(start-instructor-laptop.ps1 -Standalone → stop-all)
        if: ${{ !cancelled() && steps.install.outcome != 'skipped' }}
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\ci\windows-e2e.ps1 -Stage instructor
      - name: 靜默解除安裝(程式移除;紀錄、設定、瀏覽器端資料保留)
        if: ${{ !cancelled() && steps.install.outcome != 'skipped' }}
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\ci\windows-e2e.ps1 -Stage uninstall
      - name: 各階段結果總表
        if: ${{ !cancelled() }}
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\ci\windows-e2e.ps1 -Stage summary
      - name: 啟動腳本測試(pwsh 7,Windows)
        # run 82、85–88 連續通過(14 項)後由「先觀察」改為正式把關
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & tools\launch\tests\launch-common.tests.ps1
          exit $LASTEXITCODE
      - name: 上傳檢查結果與 log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e
          path: |
            build/tmp/windows-e2e/
          if-no-files-found: ignore
          retention-days: 14
  e2e:
    name: 端對端(Playwright + 真實核心)
    needs: detect
    if: needs.detect.outputs.web == 'true' && needs.detect.outputs.dotnet == 'true'
    runs-on: ubuntu-24.04  # Playwright 1.56 尚不支援 ubuntu-latest(26.04)的系統相依
    timeout-minutes: 30
    env:
      # Playwright 瀏覽器、NuGet、dotnet CLI 的快取都留在工作目錄內(CLAUDE.md:不寫到專案外)
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/pw-browsers
      PWTEST_CACHE_DIR: ${{ github.workspace }}/.cache/playwright-transform
      NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget/packages
      DOTNET_CLI_HOME: ${{ github.workspace }}/.cache/dotnet-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝端對端測試套件與 Chromium
        working-directory: tests/e2e
        run: |
          pnpm install --frozen-lockfile
          npx playwright install chromium --with-deps
      - name: 建置網頁與 .NET、執行端對端測試(tools/run-e2e.sh)
        run: bash tools/run-e2e.sh
      - name: PowerShell 腳本測試(pwsh;tools/run-ps-tests.sh)
        # 以執行器內建的 PowerShell 7 執行:全部 .ps1 的解析、tools/launch/tests/launch-common.tests.ps1(啟動腳本、stop-all、
        # 本機資料位置的函式)、build-release.ps1 / soak-test.ps1 的 -WhatIf;沒有 pwsh 時失敗(--require-pwsh),不默默略過
        run: bash tools/run-ps-tests.sh --require-pwsh
      - name: 上傳失敗截圖、trace 與程序 log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            build/e2e/test-results/
            build/e2e/report/
            build/e2e/results.json
            build/e2e/logs/
          if-no-files-found: ignore
          retention-days: 14

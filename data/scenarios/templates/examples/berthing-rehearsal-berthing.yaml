briefing:
  text: |-
    FS BITUMEN NO.1(FSB1)滿載,左舷靠麥寮油碼頭 3 號泊位(示意)(碼頭線 085°、長 260 m、碰墊 12 個、繫船柱 7 個;泊位為示意值)。
    預定靠泊時刻 2026-11-13 01:00 UTC;潮高 1.2 m、水深 15.2 m(最大吃水 5.71 m,UKC 約 9.49 m);潮流 250°/0.3 kn。
    預報風 020° 16 kn(陣風 0.3);能見度 5 nm。
    拖船 2 艘(麥寮1號、麥寮2號,各 40 t)在右舷艏艉帶纜推頂(推 ↔ 拉換位約 30 s)。
    引水人在船(由帶領者扮演):請完成 MPX(靠泊計畫、拖船位置與用法、繫纜順序、應變),並以檢查表確認。
    靠泊接近速度依公司程序(參數集 berthing.approachSpeed_mps);繫纜順序艏纜 → 艏倒纜 → 艉倒纜 → 艉纜(繫船柱 B7/B4/B3/B1);繫妥後由教官按「繫纜完成」結束。
  roles:
    - role: pilot
      playedBy: leader
      required: true
    - role: master
      playedBy: leader
    - role: officer
      required: true
    - role: tug
      playedBy: voiceScript
    - role: mooring
      playedBy: leader
  minParticipants: 2
  duration_s: 2400

timeline:
  - id: pilotMpx
    name: 引水人 MPX(船長/引水人資訊交換)
    when:
      type: time
      atLeast: 5
    actions:
      - voiceScript:
          role: pilot
          channel: bridge
          text: 船長,我們左舷靠麥寮油碼頭 3 號泊位。兩艘拖船在右舷艏艉帶纜推頂,接近時拉住控速。風 020° 16 節,靠攏時速度要慢。
          lang: zh-TW
      - message:
          to: instructor
          text: 觀察:MPX(靠泊計畫、拖船、繫纜順序、應變)、橫向接近速度、碰墊接觸能量
          severity: info
  - id: tugsInPosition
    name: 拖船就位
    when:
      type: time
      atLeast: 60
    actions:
      - voiceScript:
          role: tug
          channel: vhfPort
          text: 麥寮1號、麥寮2號報告:已在右舷艏艉帶纜就位,聽候指揮。
          lang: zh-TW
      - message:
          to: instructor
          text: 拖船就位:觀察拖船令是否清楚、拖船是否複誦確認(必要事件 tugOrderConfirm)
          severity: info
  - id: tideWindow
    name: 潮窗提示
    when:
      type: time
      atLeast: 120
    actions:
      - message:
          to: all
          text: 潮窗:預定靠泊 2026-11-13 01:00 UTC,潮高 1.2 m(基底水深 14 m → 水深 15.2 m,最大吃水 5.71 m,UKC 約 9.49 m);潮流 250°/0.3 kn
          severity: info
  - id: firstContact
    name: 首次碰墊接觸
    when:
      type: event
      kind: fenderContact
    actions:
      - message:
          to: instructor
          text: 首次碰墊接觸:見 summary.berthing.contacts(接近速度、能量比)
          severity: info
  - id: allFast
    name: 繫纜完成(教官)
    manual: true
    actions:
      - message:
          to: all
          text: 全部纜繩已繫妥,靠泊完成。
          severity: info
      - endExercise:
          reason: 靠泊完成
  - id: groundingEnd
    name: 擱淺
    delay_s: 2
    when:
      type: event
      kind: grounding
    actions:
      - endExercise:
          reason: 擱淺
assessment:
  parameterSet: data/parameters/company-procedures.yaml
  hardFail:
    - id: grounding
      rule: grounding
    - id: quayContact
      rule: event
      kind: quayContact
    - id: mooringLineParted
      rule: event
      kind: mooringLineParted
  bands:
    - id: approachSpeed
      metric: berthing.maxLateralSpeed_mps
      warn: "${params:berthing.approachSpeed_mps}"
      fail: "${params:berthing.approachSpeedFail_mps}"
      penalty: 10
      failPenalty: 25
    - id: berthPosition
      metric: berthing.allFastPositionError_m
      warn: "${params:berthing.allFastPositionTolerance_m}"
      fail: 2x
      penalty: 10
      failPenalty: 20
    - id: contactEnergy
      metric: berthing.maxEnergyRatio
      warn: 0.8
      fail: 1
      penalty: 10
      failPenalty: 25
    - id: fenderOverload
      metric: berthing.fenderOverloads
      warn: 0
      fail: 1
      penalty: 10
      failPenalty: 20
    - id: lineTension
      metric: berthing.maxLineTensionRatio
      warn: 0.55
      fail: 0.8
      penalty: 5
      failPenalty: 15
    - id: ukcMin
      metric: ukc.min_m
      warn: "${params:navigation.ukc.minimum_m}"
      fail: 0.5
      direction: below
      penalty: 10
      failPenalty: 25
    - id: speed
      metric: manoeuvring.timeOverSpeedLimit_s
      warn: 0
      fail: 60
      penalty: 5
      failPenalty: 10
  required:
    - id: mpx
      after:
        event: timelineTriggered
        itemId: pilotMpx
      expect:
        acknowledge:
          kind: checklist
      within_s: 300
      penalty: 10
    - id: tugOrderConfirm
      after:
        event: tugCommand
      expect:
        any:
          - acknowledge:
              kind: verbal
          - acknowledge:
              kind: report
      within_s: 60
      penalty: 5
  scoring:
    start: 100
    passMark: "${params:assessment.passMark}"

# E05 高雄港外(Charlie 引水站附近)交通與引水船(規劃書第 8.1 節 E04/E05 前段、第 3.4 節高雄港;schema:src/Contracts/scenario.schema.json)
# FSB1 滿載自西南方接近高雄第二港口,航向 045、8 kn;漲潮向西北 1.2 kn、西南風 10 kn、水深 25 m。
# 交通:T1 出港貨櫃船(對遇,COLREG 自動)、T2 自東而來的油輪(自船應讓路;目標為直航船,自船不讓時依第 17 條採最後手段)、
#       T3 自西南而來的漁船(應讓路但「不守規則」,不採取行動)、PILOT 引水船:自船距引水站 1.5 nm 內出現,跟隨自船右舷後方。

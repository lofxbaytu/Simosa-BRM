        - not: { type: event, kind: timelineTriggered, itemId: endSchilling70 }
        - not: { type: event, kind: timelineTriggered, itemId: skipSchilling70 }
        - not: { all: [ { type: event, kind: manoeuvreStarted, itemId: turning70.port }, { not: { type: time, atLeast: 60, since: { event: manoeuvreStarted, itemId: turning70.port } } } ] }
        - { type: ownSpeed, metric: stw, greaterThan: 5.0, lessThan: 7.0 }
        - { type: ownHeading, greaterThan: 358, lessThan: 2 }
    actions:
      - ownShip: { rudder: -70 }
  - id: endSchilling70
    name: 低速 70° 迴轉 180° — 回正舵
    when:
      all:
        - { type: event, kind: timelineTriggered, itemId: startedSchilling70 }
        - not: { type: event, kind: timelineTriggered, itemId: skipSchilling70 }
        - { type: ownHeading, greaterThan: 170, lessThan: 178 }
    actions:
      - ownShip: { rudder: 0 }
      - autopilot: { enabled: true, heading: 0, rotLimit: 40 }
  - id: skipSchilling70
    name: 逾時略過 — 低速 70° 左舵
    visibility: all
    when:
      all:
        - { type: time, atLeast: 2400, since: { event: timelineTriggered, itemId: executeSchilling70 } }
        - not: { type: event, kind: timelineTriggered, itemId: endSchilling70 }
    actions:
      - message: { to: all, text: "「低速 70° 左舵」未完成量測(未辨識到標準操作或量測中止),略過此段。系統回正舵、恢復車令並以自動舵回 000°。", severity: warning }
      - ownShip: { rudder: 0, telegraph: SAH }
      - autopilot: { enabled: true, heading: 0, rotLimit: 40 }
  - id: end
    name: 結束與講評
    visibility: all
    delay_s: 30
    when:
      any:
        - { type: event, kind: timelineTriggered, itemId: endSchilling70 }
        - { type: event, kind: timelineTriggered, itemId: skipSchilling70 }
    actions:
      - message: { to: all, text: "F01 完成。講評:各段預測與量測差異、左右不對稱、停船距離、低速舵效;結果見講評摘要 manoeuvres。", severity: info }
      - endExercise: { reason: F01 流程完成 }

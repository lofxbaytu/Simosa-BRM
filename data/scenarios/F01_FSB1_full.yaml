  # ---------------------------------------------------------------- 5. Schilling 舵 35° / 70° 低速舵效(No.1 專屬)
  - id: predictSchilling
    name: 預測 — Schilling 舵低速舵效
    visibility: all
    holdFor_s: 30
    when:
      all:
        - any:
            - { type: time, atLeast: "${params:familiarisation.settle_s}", since: { event: timelineTriggered, itemId: recoverInertiaStop } }
            - { type: time, atLeast: "${params:familiarisation.settle_s}", since: { event: timelineTriggered, itemId: skipInertiaStop } }
        - { type: ownSpeed, metric: stw, greaterThan: 5.0, lessThan: 7.0 }
        - { type: ownHeading, greaterThan: 358, lessThan: 2 }
    actions:
      - message: { to: all, text: "預測(慢速進約 6 kn):Schilling 舵 70° 比 35° 的戰術直徑小多少?(35°–70° 區間模型無試俥資料,僅經船長驗證)按確認(預測)。", severity: info }

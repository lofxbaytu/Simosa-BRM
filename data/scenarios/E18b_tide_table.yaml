# E18b 油碼頭進港 UKC/squat 限制 — 潮高表版(E18 的變體;規劃書第 8.1 節 E18;情境引擎設計第 1.5.1 節 environment.tide)
#   與 E18_ukc_squat_anping 同一港區、航線、區域、時間表與評估;差別只在潮汐表示法:
#   E18 以「基底水深 = 維護水深 + 潮高」與 setEnvironment waterDepth 漸變近似(8.9 → 8.6 → 8.4 m);
#   本檔以海圖/維護水深 CD 7.0 m 為基底,實際潮位以 environment.tide.table 表示(線性內插):預報潮高 +1.9 m(航程計畫),實際比預報低且提早退潮
#   (T+5 min 起退 → T+15 +1.6 m → T+35 +1.4 m → 練習結束 +1.2 m),有效水深 = 7.0 + 潮高(t),state.tideHeight_m 輸出潮高、waterDepth 為有效水深。
#   時間表的 tideLower / barShoaling 只保留語音與教官訊息(不再有 setEnvironment),UKC 由潮高表驅動;E18 本身與既有夾具不變。
# 口門、浚深航道(軸 080°、底寬 200 m、維護水深 CD 7.0 m)、兩側淺灘(CD 5.0 m)、速限區與迴船池皆為示意值(data/areas/anping-approach.json;示意,待 ENC 校正)。
# FSB2 滿載(7.2 m 平吃水)自口門外 4.0 nm 進港,HAH 約 7.5 kn(計畫在航道外端前減至 SAH)、自動舵 077°(含橫流修正)。
# squat 隨速度劇增(MMG ICORELS;FSB2 在 8.5 m 水深:DSAH 約 0.35 m、SAH 約 0.45 m、HAH 約 0.8 m、FAH 約 1.0 m):碼頭「速度誘惑」要求加速趕泊位時段。
# 時間表:T+5 degraded(tideLower:潮位站通報潮位比預報低且提早)→ T+12 碼頭/代理行要求加速(速度誘惑)→ 通過沙洲段 BAR(或 T+35)emergency(barShoaling:潮位續降、
#   前船回報沙洲段水深淺於海圖)→ 到達迴船池、擱淺或 T+55 結束;測深儀淺水警報(alerts.shallowWater_m,龍骨下 < 0.8 m)。
# 評估:與 E18 相同(ukc.min_m 容許帶、UKC 低於政策的超限時間、航道速限、ECDIS 安全等深線、潮位通報後重算 UKC、質疑加速要求、淺水警報後減速;硬性失敗:擱淺、UKC < 5 % 吃水)。
id: E18b_tide_table
name: 安平港油碼頭進港 UKC/squat 限制(潮高表)
description: >-
  滿載淺水航道進港(E18 的潮高表版):潮汐以 environment.tide.table 表示,實際潮位比預報早且低、速度相關 squat、
  碼頭要求加速的速度誘惑、測深儀 UKC 警報與 ECDIS 安全等深線;練習潮窗與 UKC 規劃、監控、減速決策與對外部壓力的質疑。
seed: 20261104
startTimeUtc: "2026-11-04T05:00:00Z"
timeScale: 1
ship:
  id: FSB2
  loading: full
origin: { lat: 22.9920, lon: 120.1530 }          # 安平港口門(示意)
initial:
  position: { lat: 22.98044, lon: 120.08181 }     # 航線 APPROACH(口門外 4.0 nm)
  heading: 77
  speed: 7.5
  telegraph: HAH
  rudder: 0
environment:
  wind: { trueSpeed: 12, trueDir: 20, gustiness: 0.15 }
  current: { set: 170, drift: 0.3 }
  waterDepth: 7.0                                 # 海圖/維護水深 CD 7.0 m(淤積,港方公告;示意);有效水深 = 7.0 + 潮高(t)
  visibility_nm: 8
  tide:                                           # 實際潮位(潮位站;示意):預報 +1.9 m 持平,實際自 T+5 min 起提早退潮且偏低
    table:
      - { t: 0, height_m: 1.9 }
      - { t: 300, height_m: 1.85 }
      - { t: 900, height_m: 1.6 }                 # 通報時(T+5)起 10 分鐘內退 0.25 m,之後緩降
      - { t: 1500, height_m: 1.5 }
      - { t: 2100, height_m: 1.4 }
      - { t: 3300, height_m: 1.2 }
alerts:
  shallowWater_m: "${params:navigation.ukc.shallowAlarm_m}"
briefing:
  text: |
    交班(13:00 地方時):No.2 滿載瀝青(7.2 m 平吃水)抵安平港,口門外 4.0 nm,HAH 約 7.5 kn,自動舵 077°(航道軸 080°,已修正向南的橫流 0.3 kn)。
    書面航程計畫(潮窗):維護水深 CD 7.0 m(淤積,港方公告;示意)+ 預報潮高 1.9 m = 8.9 m,靜態 UKC 1.7 m;公司 UKC 政策:航道內 ≥ 10 % 吃水(0.72 m,含 squat)。
    squat 計畫:8.5 m 水深時 DSAH 約 0.35 m、SAH 約 0.45 m、HAH 約 0.8 m(超出政策)——計畫在航道外端(OUTER)前減至 SAH、航道內 ≤ SAH,港方航道速限見參數集 port.anping.channelSpeedLimit_kn。
    ECDIS 安全等深線:吃水 + UKC + squat ≈ 9 m,航道兩側淺灘(約 5 m)在安全等深線以外;測深儀淺水警報設定龍骨下 0.8 m。
    接班者完成交班檢查表(含 UKC/squat 計算與潮窗)後由教官確認(acknowledge checklist)。
  attachments:
    - { title: "航程計畫與 UKC/squat 計算(安平港,示意)", file: docs/passage-plan-E18.pdf }
    - { title: "潮汐預報(中央氣象署,示意)", file: docs/tide-forecast-E18.pdf }
    - { title: "公司 UKC 政策(SMS-NAV-012)", file: docs/ukc-policy.pdf }
    - { title: 交班檢查表, file: docs/handover-checklist.pdf }
  roles:
    - { role: master, playedBy: leader }
    - { role: officer, required: true }
    - { role: pilot, playedBy: leader }
    - { role: helmsman }
    - { role: portControl, playedBy: voiceScript }
    - { role: terminal, playedBy: voiceScript }
  minParticipants: 2
  duration_s: 3300
route:
  name: 安平港油品碼頭進港(示意)
  xtdLimit_m: "${params:navigation.xtd.dredgedChannel_m}"
  waypoints:                                      # data/areas/anping-approach.json route 的 APPROACH 起子序列
    - { name: APPROACH, lat: 22.98044, lon: 120.08181 }
    - { name: OUTER, lat: 22.98333, lon: 120.09961, checkpoint: true, report: "安平港控制台:航道外端報告(示意)" }
    - { name: BAR, lat: 22.98853, lon: 120.13164, checkpoint: true }
    - { name: ENTRANCE, lat: 22.992, lon: 120.153 }
    - { name: BASIN, lat: 22.99316, lon: 120.16012, arrivalRadius_m: 200 }
zones:
  - id: channel
    name: 浚深航道(UKC 政策 10 % 吃水;示意)
    type: ukcPolicy
    ukcMin: { fractionOfDraft: "${params:navigation.ukc.channel_fraction}" }
    polygon:                                      # 與 data/areas/anping-approach.json channel.polygon 相同
      - { lat: 22.98364, lon: 120.09588 }
      - { lat: 22.99461, lon: 120.16351 }
      - { lat: 22.99285, lon: 120.16385 }
      - { lat: 22.98188, lon: 120.09622 }
  - id: channelSpeed
    name: 航道速限區(示意)
    type: speedLimit
    speedLimit_kn: "${params:port.anping.channelSpeedLimit_kn}"
    polygon:                                      # 與 channel 相同
      - { lat: 22.98364, lon: 120.09588 }
      - { lat: 22.99461, lon: 120.16351 }
      - { lat: 22.99285, lon: 120.16385 }
      - { lat: 22.98188, lon: 120.09622 }
  - id: northShoal
    name: 航道北側淺灘(ECDIS 安全等深線以外,示意)
    type: ukcPolicy
    waterDepth_m: 5.0
    polygon:                                      # 與 data/areas/anping-approach.json shoals[northShoal] 相同
      - { lat: 22.98435, lon: 120.09575 }
      - { lat: 22.99532, lon: 120.16337 }
      - { lat: 23.007, lon: 120.16114 }
      - { lat: 22.99603, lon: 120.09351 }
  - id: southShoal
    name: 航道南側淺灘(ECDIS 安全等深線以外,示意)
    type: ukcPolicy
    waterDepth_m: 5.0
    polygon:                                      # 與 data/areas/anping-approach.json shoals[southShoal] 相同
      - { lat: 22.98117, lon: 120.09635 }
      - { lat: 22.99214, lon: 120.16399 }
      - { lat: 22.98046, lon: 120.16622 }
      - { lat: 22.96949, lon: 120.09859 }
timeline:
  - id: handover
    name: 交班(潮窗與 UKC)
    when: { type: time, atLeast: 1 }
    actions:
      - voiceScript: { role: narrator, channel: bridge, text: "交班:口門外四浬,HAH,自動舵 077,航道外端前要減到 SAH。預報潮高一點九米,靜態龍骨下一點七米。航道裡 squat 很大,計畫不超過 SAH。測深儀警報設零點八米。", lang: zh-TW }
      - message: { to: instructor, text: "交班開始:觀察是否核對 UKC/squat 計算、潮窗、航道速限、ECDIS 安全等深線與測深儀警報設定,完成後按「檢查表」", severity: info }
  - id: autopilotOn
    name: 自動舵 077°(交班狀態)
    when: { type: time, atLeast: 2 }
    actions:
      - autopilot: { enabled: true, heading: 77 }
  - id: tideLower
    name: 潮位比預報低且提早退潮
    phase: degraded
    when: { type: time, atLeast: "${params:navigation.e18.tideLowerAt_s}" }
    actions:
      - voiceScript: { role: portControl, channel: vhfPort, text: "安平港控制台:潮位站實測潮高比預報低零點三米,而且提早退潮,請各船注意龍骨下水深。", lang: zh-TW }
      - message: { to: instructor, text: "潮高表:+1.85 → +1.6 m(T+15;有效水深 8.85 → 8.6 m):觀察是否重算 UKC(含 squat)並回報船長/引水人(acknowledge report 或 verbal)、修正計畫航速", severity: warning }
  - id: speedPressure
    name: 碼頭要求加速(速度誘惑)
    when: { type: time, atLeast: "${params:navigation.e18.speedPressureAt_s}" }
    actions:
      - voiceScript: { role: terminal, channel: vhfPort, text: "油品碼頭呼叫 FS Bitumen No.2:下一艘船兩小時後要靠,請你們加速到八節以上,三十分鐘內到碼頭,不然泊位要讓出去。", lang: zh-TW }
      - message: { to: instructor, text: "速度誘惑:加速會使 squat 增加、UKC 低於政策且超過航道速限;觀察是否質疑並維持計畫航速(acknowledge verbal 或 report)", severity: warning }
  - id: barShoaling
    name: 沙洲段淺化與潮位續降
    phase: emergency
    when:
      any:
        - { type: routeLeg, passedWaypoint: BAR }
        - { type: time, atLeast: "${params:navigation.e18.emergencyAt_s}" }
    actions:
      - voiceScript: { role: portControl, channel: vhfPort, text: "安平港控制台:前一艘船回報沙洲到口門之間實測水深比海圖淺,潮位還在下降。", lang: zh-TW }
      - message: { to: instructor, text: "潮高表續降(T+35 +1.4 m、結束 +1.2 m;有效水深 8.4 → 8.2 m):SAH 時 UKC 接近政策下限、HAH 以上低於政策;觀察監控(測深儀、UKC)與減速", severity: alarm }
  - id: ukcBelowPolicy
    name: UKC 低於政策
    when: { type: ukc, lessThanFractionOfDraft: "${params:navigation.ukc.channel_fraction}" }
    actions:
      - message: { to: instructor, text: "UKC(含 squat)低於公司政策 10 % 吃水", severity: warning }
  - id: arrived
    name: 到達迴船池
    when: { type: ownDistance, waypoint: BASIN, lessThan: 0.1 }
    actions:
      - endExercise: { reason: 到達迴船池 }
  - id: groundingEnd
    name: 擱淺
    delay_s: 2
    when: { type: event, kind: grounding }
    actions:
      - endExercise: { reason: 擱淺 }
  - id: timeUp
    name: 練習時間到
    when: { type: time, atLeast: 3300 }
    actions:
      - endExercise: { reason: 練習時間到 }
assessment:
  parameterSet: data/parameters/company-procedures.yaml
  ukc:
    min: { fractionOfDraft: "${params:navigation.ukc.channel_fraction}" }   # 淺水沿岸進港段全程 10 % 吃水(航道 zones[channel] 相同)
  manoeuvring:
    rotLimit_degPerMin: "${params:manoeuvring.rotLimit_degPerMin}"
  hardFail:
    - { id: grounding, rule: grounding }
    - { id: ukcHard, rule: ukc, lessThan: { fractionOfDraft: "${params:navigation.ukc.hardFail_fraction}" } }
  bands:
    - { id: ukcMin, metric: ukc.min_m, direction: below, warn: "${params:navigation.ukc.minWarn_m}", fail: "${params:navigation.ukc.minFail_m}", penalty: 10, failPenalty: 25 }
    - { id: ukcTime, metric: ukc.timeBelowLimit_s, warn: 0, fail: 120, penalty: 5, failPenalty: 15 }
    - { id: speed, metric: manoeuvring.maxOverSpeed_kn, warn: 0.5, fail: 2.0, penalty: 5, failPenalty: 15 }
    - { id: xtdMax, metric: track.maxXtd_m, warn: "${params:navigation.xtd.dredgedChannel_m}", fail: 1.4x, penalty: 10, failPenalty: 20 }
    - { id: xtdTime, metric: track.timeOutsideCorridor_s, warn: 0, fail: 120, penalty: 5, failPenalty: 10 }
  required:
    - id: handoverChecklist
      after: { event: timelineTriggered, itemId: handover }
      expect: { acknowledge: { kind: checklist } }
      within_s: "${params:bridge.handover.checklist_s}"
      penalty: 5
    - id: tideReport
      after: { event: timelineTriggered, itemId: tideLower }
      expect: { any: [ { acknowledge: { kind: report } }, { acknowledge: { kind: verbal } } ] }
      within_s: "${params:navigation.ukc.tideReport_s}"
      penalty: 10
    - id: speedChallenge
      after: { event: timelineTriggered, itemId: speedPressure }
      expect: { any: [ { acknowledge: { kind: verbal } }, { acknowledge: { kind: report } } ] }
      within_s: "${params:navigation.ukc.speedChallenge_s}"
      penalty: 10
    - id: ukcAlarmResponse
      after: { event: alertRaised, itemId: shallowWater }
      expect: { any: [ telegraphChange, rpmOrder ] }
      within_s: "${params:navigation.ukc.alarmResponse_s}"
      penalty: 10
  scoring: { start: 100, passMark: "${params:assessment.passMark}" }

    initial:
      position: { x: 6998, y: 2852 }              # 右舷前方約 4.1 nm,航向 290° 橫越;不行動時 T+15 min CPA 約 0.1 nm(自船讓路)
      heading: 290
      speed: 12
    behaviour:
      mode: colreg
      colreg: { obey: true, cpaThreshold: 1.0, tcpaThreshold: 12, turn: 30, lastResort: true }   # 直航船;自船不讓時依第 17 條最後手段

    destination: TAICHUNG
    initial:
      position: { x: -4544, y: 5217 }             # 左舷前方約 3.7 nm,航向 075° 橫越;T+22 min 於自船艏前約 0.25 nm 通過(讓路船,不行動)
      heading: 75
      speed: 11
    behaviour:
      mode: colreg
      colreg: { obey: false }                     # 「不守規則」:辨識情境但不讓路
